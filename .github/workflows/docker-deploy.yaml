name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and test
        working-directory: app
        run: |
          npm ci
          npm test --if-present

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: veecode
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
          
            chmod +x /home/veecode/connexxiongroup_project/scrip.sh
            ./home/veecode/connexxiongroup_project/scrip.sh
            sudo systemctl stop connexxiongroup.service || true
            sudo systemctl disable connexxiongroup.service || true

