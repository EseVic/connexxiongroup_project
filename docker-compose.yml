services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: connexxion-app:local
    container_name: connexxion-app
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - ./app/.env

    # --- Filesystem hardening ---
    # The entire container filesystem is read-only. 
    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777

    volumes:
      - app-data:/usr/src/app/data

    # --- Privilege hardening ---
    user: "connexxiongroup"

    security_opt:
      - no-new-privileges:true

    #the container runs with zero capabilities.
    cap_drop:
      - ALL

    # --- Resource limits ---
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data: